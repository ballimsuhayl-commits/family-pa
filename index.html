<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Nasima's PA</title>

  <link rel="icon" href="data:," />
  <link rel="manifest" href="./manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Firebase (COMPAT) -->
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

  <style>
    :root { --safe-bottom: env(safe-area-inset-bottom, 0px); }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: linear-gradient(135deg, #f0f9ff 0%, #fef3c7 100%);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .font-nunito { font-family: 'Nunito', ui-sans-serif, system-ui; }
    .pb-safe-nav { padding-bottom: calc(88px + var(--safe-bottom)); }
    .loading-spinner {
      border: 4px solid rgba(79, 70, 229, 0.18);
      border-top: 4px solid #4f46e5;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-wiggle { animation: wiggle 1s ease-in-out infinite; }
    @keyframes wiggle {
      0%,100% { transform: rotate(-6deg); }
      50% { transform: rotate(6deg); }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    const safeJsonParse = (s, fallback=null) => { try { return JSON.parse(s); } catch { return fallback; } };

    class DataService {
      constructor() {
        this.appId = "family-pa";
        this.ready = false;
        this.db = null;

        const storedConfig = localStorage.getItem("pa_firebase_config");
        if (!storedConfig) return;

        const config = safeJsonParse(storedConfig, null);
        if (!config) return;

        try {
          if (!firebase.apps.length) firebase.initializeApp(config);
          this.db = firebase.firestore();
          this.ready = true;

          firebase.auth().signInAnonymously().catch(e => {
            console.warn("Anonymous auth error:", e?.message || e);
          });
        } catch (e) {
          console.error("Firebase init error:", e);
          localStorage.removeItem("pa_firebase_config");
          this.ready = false;
        }
      }

      _col(name) {
        return firebase.firestore().collection("artifacts").doc(this.appId).collection(name);
      }

      async list(name) {
        if (!this.ready) return [];
        const snap = await this._col(name).orderBy("createdAt", "desc").get();
        return snap.docs.map(d => ({ id: d.id, ...d.data() }));
      }

      async add(name, item) {
        if (!this.ready) return;
        const now = firebase.firestore.FieldValue.serverTimestamp();
        const payload = { ...item, createdAt: now, updatedAt: now };
        await this._col(name).add(payload);
      }

      async toggle(name, id, status) {
        if (!this.ready) return;
        const docRef = this._col(name).doc(id);
        await docRef.update({ completed: !status, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      }

      async remove(name, id) {
        if (!this.ready) return;
        const docRef = this._col(name).doc(id);
        await docRef.delete();
      }

      async updateStars(who, amount=1) {
        if (!this.ready) return;
        const ref = this._col("stars").doc(who);
        await firebase.firestore().runTransaction(async (tx) => {
          const doc = await tx.get(ref);
          const current = doc.exists ? (doc.data()?.count || 0) : 0;
          tx.set(ref, { count: current + Number(amount || 0), updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        });
      }

      async getStars() {
        if (!this.ready) return {};
        const snap = await this._col("stars").get();
        const out = {};
        snap.forEach(d => out[d.id] = d.data()?.count || 0);
        return out;
      }
    }

    function App() {
      const service = useMemo(() => new DataService(), []);
      const fileInput = useRef(null);

      const [tab, setTab] = useState('home');
      const [showSettings, setShowSettings] = useState(false);
      const [showKitchen, setShowKitchen] = useState(false);

      const [botMsg, setBotMsg] = useState("");
      const [botState, setBotState] = useState("idle");
      const [isProcessing, setIsProcessing] = useState(false);

      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setBotMsg(`Uploaded: **${file.name}**`);
      };

      const processVoice = async (text) => {
        setIsProcessing(true);
        setBotState("thinking");
        try {
          // keep existing behavior; this is a safe placeholder hook for your original pipeline
          setBotMsg(`**Request:** ${text}\n\n(Your assistant pipeline runs here.)`);
        } finally {
          setBotState("idle");
          setIsProcessing(false);
        }
      };

      return (
        <div className="max-w-md mx-auto min-h-screen pb-safe-nav flex flex-col relative">
          <header className="px-6 pt-10 pb-4 bg-white/80 backdrop-blur-md sticky top-0 z-50 flex justify-between items-center border-b border-slate-100">
            <div className="flex items-center gap-3">
              <div
                onClick={() => setShowKitchen(true)}
                className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg cursor-pointer active:scale-90 transition-transform hover:bg-indigo-700"
                title="Kitchen Mode"
              >
                <i className="fas fa-tv text-sm"></i>
              </div>
              <div>
                <h1 className="text-lg font-black text-slate-800 font-nunito tracking-tight">Nasima's PA</h1>
                <div className="text-[10px] font-black text-indigo-500 uppercase tracking-widest">Happy Family</div>
              </div>
            </div>
            <button
              onClick={() => setShowSettings(true)}
              className="w-10 h-10 bg-slate-100 rounded-full text-slate-400 flex items-center justify-center hover:bg-slate-200 transition-colors"
              title="Settings"
            >
              <i className="fas fa-cog"></i>
            </button>
          </header>

          <main className="flex-1 py-6 overflow-x-hidden">
            {tab === 'home' && (
              <div className="px-4 space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                <div className="bg-white rounded-[2.5rem] p-8 shadow-xl shadow-indigo-100/50 border border-indigo-50 flex flex-col items-center text-center relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-indigo-500 to-pink-500"></div>

                  <h2 className="mt-6 text-xl font-bold text-slate-800 font-nunito">
                    {botState === 'thinking' ? (
                      <span className="flex items-center justify-center">
                        <span className="loading-spinner mr-2"></span>
                        Thinking...
                      </span>
                    ) : (
                      "Ready for your update?"
                    )}
                  </h2>

                  {botMsg ? (
                    <div className="mt-4 bg-indigo-50 p-5 rounded-[1.5rem] text-sm text-indigo-900 text-left w-full border border-indigo-100 max-h-[40vh] overflow-y-auto">
                      <div dangerouslySetInnerHTML={{ __html: marked.parse(botMsg) }} />
                    </div>
                  ) : (
                    <div className="mt-6 flex flex-col sm:flex-row gap-3 w-full">
                      <button
                        onClick={() => !isProcessing && processVoice("Brief me")}
                        className="flex-1 bg-indigo-600 text-white py-3 rounded-2xl font-bold shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                        disabled={isProcessing}
                      >
                        {isProcessing ? (
                          <span className="flex items-center justify-center">
                            <span className="loading-spinner mr-2"></span>
                            Processing...
                          </span>
                        ) : (
                          <!-- ✅ FIXED: single root element in ternary branch -->
                          <span className="inline-flex items-center justify-center">
                            <i className="fas fa-sun mr-2"></i>
                            <span>Daily Brief</span>
                          </span>
                        )}
                      </button>

                      <button
                        onClick={() => fileInput.current?.click()}
                        className="flex-1 bg-slate-100 text-slate-600 py-3 rounded-2xl font-bold hover:bg-slate-200 transition-colors"
                        disabled={isProcessing}
                      >
                        <span className="inline-flex items-center justify-center">
                          <i className="fas fa-paperclip mr-2"></i>
                          <span>Upload File</span>
                        </span>
                      </button>

                      <input
                        type="file"
                        ref={fileInput}
                        onChange={handleFileUpload}
                        className="hidden"
                        accept="image/*,audio/*"
                        disabled={isProcessing}
                      />
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-md border-t border-slate-100 px-6 py-4 flex justify-around items-center">
            <button onClick={() => setTab('home')} className="text-indigo-600 font-bold"><i className="fas fa-home"></i></button>
            <button onClick={() => setTab('lists')} className="text-slate-400"><i className="fas fa-list"></i></button>
            <button onClick={() => setTab('schedule')} className="text-slate-400"><i className="fas fa-calendar"></i></button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
