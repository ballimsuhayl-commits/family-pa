// --- BRAIN SERVICE (GEMINI 2.5 FLASH) - FIXED ---
class BrainService {
  constructor() {
    this.baseUrl = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-exp-1206:generateContent";
  }
  
  getApiKey() { 
    return localStorage.getItem('pa_gemini_key') || ""; 
  }
  
  async think(prompt, fileData = null) {
    const apiKey = this.getApiKey();
    if (!apiKey) return { error: "MISSING_KEY", reply: "Please add your Gemini API key in Settings to enable smart features!" };
    
    const parts = [{ text: prompt }];
    if (fileData) parts.push({ inlineData: { mimeType: fileData.type, data: fileData.base64 } });
    
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000); // 15 second timeout
      
      const response = await fetch(`${this.baseUrl}?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: parts }],
          generationConfig: { responseMimeType: "application/json" }
        }),
        signal: controller.signal
      });
      
      clearTimeout(timeoutId);
      
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      
      const data = await response.json();
      
      // Better error handling for AI responses
      if (!data.candidates || !data.candidates[0] || !data.candidates[0].content || !data.candidates[0].content.parts) {
        return { 
          error: "INVALID_RESPONSE", 
          reply: "I got confused processing that. Could you try rephrasing your request?" 
        };
      }
      
      try {
        return JSON.parse(data.candidates[0].content.parts[0].text);
      } catch (parseError) {
        return { 
          error: "JSON_PARSE_ERROR", 
          reply: "I understood your request but had trouble formatting my response. Try again with simpler wording!" 
        };
      }
      
    } catch (e) {
      console.error("Brain error:", e);
      return { 
        error: "BRAIN_ERROR", 
        reply: e.name === 'AbortError' ? 
          "I'm taking too long to think! Check your internet connection and try again." :
          "My thinking engine is having trouble. Try again in a moment!"
      };
    }
  }
  
  async chat(prompt) {
    const apiKey = this.getApiKey();
    if (!apiKey) return "Please paste your API key in Settings.";
    
    try {
      const response = await fetch(`${this.baseUrl}?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });
      
      const data = await response.json();
      return data.candidates[0].content.parts[0].text;
    } catch (e) { 
      return "I'm offline right now. Try again later!";
    }
  }
}
const brain = new BrainService();

// --- DATA SERVICE (FIREBASE) - FIXED GLOBAL ACCESS ---
class DataService {
  constructor() {
    this.db = null;
    this.appId = 'nasima-family-pa';
    this.unsubscribeEvents = null;
    this.unsubscribeTasks = null;
    this.unsubscribeShopping = null;
    
    // Initialize Firebase from global scope
    this.initFirebase();
    
    // Initialize default family status if not exists
    if (!localStorage.getItem('pa_family_status')) {
      localStorage.setItem('pa_family_status', JSON.stringify([
        { id: 'nasima', name: 'Nasima', letter: 'N', status: 'Available', style: 'family-nasima', stars: 0 },
        { id: 'suhayl', name: 'Suhayl', letter: 'S', status: 'Working', style: 'family-suhayl', stars: 0 },
        { id: 'rayhaan', name: 'Rayhaan', letter: 'R', status: 'School', style: 'family-rayhaan', stars: 0 },
        { id: 'zaara', name: 'Zaara', letter: 'Z', status: 'School', style: 'family-zaara', stars: 0 },
        { id: 'jabu', name: 'Jabu', letter: 'J', status: 'Helping', style: 'family-jabu', stars: 0 },
        { id: 'lisa', name: 'Lisa', letter: 'L', status: 'Helping', style: 'family-lisa', stars: 0 },
      ]));
    }
  }
  
  initFirebase() {
    const storedConfig = localStorage.getItem('pa_firebase_config');
    if (storedConfig) {
      try {
        // Use global firebase object
        const config = JSON.parse(storedConfig);
        
        // Validate config
        const requiredFields = ['apiKey', 'projectId', 'appId'];
        const missingFields = requiredFields.filter(field => !config[field]);
        
        if (missingFields.length > 0) {
          throw new Error(`Missing Firebase config fields: ${missingFields.join(', ')}`);
        }
        
        // Initialize Firebase
        if (!firebase.apps.length) {
          firebase.initializeApp(config);
        }
        
        this.db = firebase.firestore();
        
        // Setup anonymous auth
        const auth = firebase.auth();
        auth.signInAnonymously().catch(e => {
          console.warn("Anonymous auth failed, continuing without auth:", e);
        });
        
        console.log("Firebase initialized successfully");
        this.setupRealtimeSync();
        
      } catch (e) {
        console.error("Firebase initialization failed:", e);
        localStorage.removeItem('pa_firebase_config'); // Clear invalid config
        alert(`Firebase setup failed: ${e.message}. Please check your configuration in Settings.`);
      }
    }
  }
  
  setupRealtimeSync() {
    if (!this.db) return;
    
    try {
      // Setup real-time sync for all collections
      const collections = ['tasks', 'shopping', 'events'];
      
      collections.forEach(collectionName => {
        const collectionRef = this.db.collection('artifacts').doc(this.appId)
                           .collection('public').doc('data')
                           .collection(collectionName);
        
        const query = collectionRef.orderBy('createdAt', 'desc');
        
        const unsubscribe = query.onSnapshot((snapshot) => {
          const cloudItems = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));
          
          // Merge with local storage (keep local items that aren't in cloud yet)
          const localKey = `pa_${collectionName}`;
          const localItems = JSON.parse(localStorage.getItem(localKey) || '[]');
          
          // Keep local items that don't have cloud IDs yet
          const mergedItems = [
            ...cloudItems,
            ...localItems.filter(item => item.id.startsWith('loc_') && 
                         !cloudItems.some(cloudItem => cloudItem.text === item.text))
          ];
          
          localStorage.setItem(localKey, JSON.stringify(mergedItems));
          
        }, (error) => {
          console.error(`Firestore sync error for ${collectionName}:`, error);
        });
        
        // Store unsubscribe functions
        if (collectionName === 'events') this.unsubscribeEvents = unsubscribe;
        if (collectionName === 'tasks') this.unsubscribeTasks = unsubscribe;
        if (collectionName === 'shopping') this.unsubscribeShopping = unsubscribe;
        
      });
      
    } catch (e) {
      console.error("Error setting up realtime sync:", e);
    }
  }
  
  cleanup() {
    // Unsubscribe from all listeners
    if (this.unsubscribeEvents) this.unsubscribeEvents();
    if (this.unsubscribeTasks) this.unsubscribeTasks();
    if (this.unsubscribeShopping) this.unsubscribeShopping();
    this.unsubscribeEvents = null;
    this.unsubscribeTasks = null;
    this.unsubscribeShopping = null;
  }
  
  getFamilyStatus() { 
    return JSON.parse(localStorage.getItem('pa_family_status') || '[]'); 
  }
  
  updateStars(memberId, amount) {
    let family = this.getFamilyStatus();
    family = family.map(f => {
      if (f.name.toLowerCase().includes(memberId.toLowerCase())) {
        return { ...f, stars: (f.stars || 0) + amount };
      }
      return f;
    });
    localStorage.setItem('pa_family_status', JSON.stringify(family));
    return family;
  }
  
  async add(collectionName, item) {
    const localKey = `pa_${collectionName}`;
    const localItems = JSON.parse(localStorage.getItem(localKey) || '[]');
    const newItem = { 
      id: 'loc_' + Date.now(), 
      ...item, 
      createdAt: Date.now(),
      completed: item.completed || false
    };
    
    // Add to local storage immediately for optimistic UI
    const updatedItems = [newItem, ...localItems];
    localStorage.setItem(localKey, JSON.stringify(updatedItems));
    
    // Try to sync to cloud
    if (this.db) {
      try {
        const collectionRef = this.db.collection('artifacts').doc(this.appId)
                           .collection('public').doc('data')
                           .collection(collectionName);
        
        const docRef = await collectionRef.add({ 
          ...item, 
          createdAt: Date.now(),
          completed: item.completed || false
        });
        
        // Update local item with cloud ID
        const finalItems = updatedItems.map(i => 
          i.id === newItem.id ? { ...i, id: docRef.id } : i
        );
        
        localStorage.setItem(localKey, JSON.stringify(finalItems));
        return { ...newItem, id: docRef.id };
        
      } catch (e) {
        console.error(`Cloud sync failed for ${collectionName}:`, e);
        // Keep local version - it will sync later when connection is restored
        return newItem;
      }
    }
    
    return newItem;
  }
  
  subscribe(collectionName, callback) {
    const localKey = `pa_${collectionName}`;
    const localItems = JSON.parse(localStorage.getItem(localKey) || '[]');
    callback(localItems.filter(i => !i.completed)); // Filter out completed items for UI
    
    // Return cleanup function
    return () => {
      // No-op for now, real-time sync is handled at init
    };
  }
  
  getSnapshot() {
    return {
      tasks: JSON.parse(localStorage.getItem('pa_tasks') || '[]').filter(i => !i.completed),
      shopping: JSON.parse(localStorage.getItem('pa_shopping') || '[]').filter(i => !i.completed),
      events: JSON.parse(localStorage.getItem('pa_events') || '[]'),
      family: this.getFamilyStatus()
    };
  }
  
  async toggle(col, id, status) {
    // Update local storage first
    let items = JSON.parse(localStorage.getItem(`pa_${col}`) || '[]');
    items = items.map(i => i.id === id ? { ...i, completed: !status } : i);
    localStorage.setItem(`pa_${col}`, JSON.stringify(items));
    
    // Try to update cloud
    if (this.db && !id.startsWith('loc_')) {
      try {
        const docRef = this.db.collection('artifacts').doc(this.appId)
                     .collection('public').doc('data')
                     .collection(col).doc(id);
        
        await docRef.update({ completed: !status });
      } catch (e) {
        console.error(`Cloud update failed for ${col}/${id}:`, e);
        // Local state is already updated, will sync later
      }
    }
  }
  
  async remove(col, id) {
    // Update local storage first
    let items = JSON.parse(localStorage.getItem(`pa_${col}`) || '[]');
    items = items.filter(i => i.id !== id);
    localStorage.setItem(`pa_${col}`, JSON.stringify(items));
    
    // Try to remove from cloud
    if (this.db && !id.startsWith('loc_')) {
      try {
        const docRef = this.db.collection('artifacts').doc(this.appId)
                     .collection('public').doc('data')
                     .collection(col).doc(id);
        
        await docRef.delete();
      } catch (e) {
        console.error(`Cloud delete failed for ${col}/${id}:`, e);
        // Local state is already updated, will sync later
      }
    }
  }
}

const SettingsModal = ({ onClose }) => {
  const [geminiKey, setGeminiKey] = useState(localStorage.getItem('pa_gemini_key') || '');
  const [fbConfig, setFbConfig] = useState(localStorage.getItem('pa_firebase_config') || '');
  const [isTesting, setIsTesting] = useState(false);
  const [testResult, setTestResult] = useState(null);
  
  const save = () => {
    if (geminiKey.trim()) {
      localStorage.setItem('pa_gemini_key', geminiKey.trim());
    }
    
    if (fbConfig.trim()) {
      try {
        const config = JSON.parse(fbConfig.trim());
        localStorage.setItem('pa_firebase_config', JSON.stringify(config));
      } catch (e) {
        alert("Invalid Firebase config JSON! Please check the format.");
        return;
      }
    }
    
    // Reload to apply changes
    window.location.reload();
  };
  
  const testConnection = async () => {
    setIsTesting(true);
    setTestResult(null);
    
    try {
      // Test Gemini
      if (geminiKey.trim()) {
        const testBrain = new BrainService();
        testBrain.getApiKey = () => geminiKey.trim();
        
        const testResponse = await testBrain.chat("Hello! This is a connection test.");
        if (!testResponse.includes("I'm offline")) {
          setTestResult(prev => ({ ...prev, gemini: "✅ Gemini API working!" }));
        } else {
          setTestResult(prev => ({ ...prev, gemini: "❌ Gemini API test failed" }));
        }
      }
      
      // Test Firebase
      if (fbConfig.trim()) {
        try {
          const config = JSON.parse(fbConfig.trim());
          if (!firebase.apps.length) {
            firebase.initializeApp(config);
          }
          
          const testDb = firebase.firestore();
          await testDb.collection('test').doc('connection').set({ 
            test: true, 
            timestamp: new Date().toISOString() 
          });
          
          setTestResult(prev => ({ ...prev, firebase: "✅ Firebase connection working!" }));
          
        } catch (e) {
          setTestResult(prev => ({ ...prev, firebase: `❌ Firebase test failed: ${e.message}` }));
        }
      }
      
    } catch (e) {
      setTestResult({ error: `Test failed: ${e.message}` });
    } finally {
      setIsTesting(false);
    }
  };
  
  return (
    <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
      <div className="bg-white rounded-[2rem] p-8 w-full max-w-sm shadow-2xl space-y-4">
        <h3 className="text-xl font-bold font-nunito text-indigo-600 flex items-center gap-2"><i className="fas fa-tools"></i> App Settings</h3>
        
        <div className="security-warning">
          <p className="text-sm font-medium text-red-700">
            <i className="fas fa-exclamation-triangle mr-2"></i>
            API keys are stored in your browser. Only use this app on trusted devices.
          </p>
        </div>
        
        <div>
          <label className="text-xs font-bold text-slate-400 uppercase">Gemini API Key</label>
          <input 
            value={geminiKey} 
            onChange={e => setGeminiKey(e.target.value)} 
            className="w-full bg-slate-100 p-3 rounded-xl text-sm focus:ring-2 ring-indigo-500 outline-none" 
            placeholder="AIzaSy... (get from Google AI Studio)"
          />
          <p className="text-xs text-slate-500 mt-1">
            Get your key from: <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-indigo-600 underline">Google AI Studio</a>
          </p>
        </div>
        
        <div>
          <label className="text-xs font-bold text-slate-400 uppercase">Firebase Web Config (JSON)</label>
          <textarea 
            value={fbConfig} 
            onChange={e => setFbConfig(e.target.value)} 
            rows="4" 
            className="w-full bg-slate-100 p-3 rounded-xl text-xs font-mono focus:ring-2 ring-indigo-500 outline-none" 
            placeholder='{"apiKey": "...", "projectId": "...", "appId": "..."}'
          />
          <p className="text-xs text-slate-500 mt-1">
            Get config from Firebase Console > Project Settings > Web Apps
          </p>
        </div>
        
        <div className="flex gap-2">
          <button 
            onClick={testConnection} 
            disabled={isTesting}
            className={`flex-1 ${isTesting ? 'bg-slate-400' : 'bg-blue-500'} text-white py-3 rounded-2xl font-bold`}
          >
            {isTesting ? (
              <span className="flex items-center justify-center"><span className="loading-spinner mr-2"></span> Testing...</span>
            ) : (
              <i className="fas fa-plug mr-2"></i> Test Connection
            )}
          </button>
          <button 
            onClick={save} 
            className="flex-1 bg-indigo-600 text-white py-3 rounded-2xl font-bold shadow-lg shadow-indigo-200"
          >
            <i className="fas fa-save mr-2"></i> Save & Restart
          </button>
        </div>
        
        {testResult && (
          <div className="mt-4 space-y-2">
            {testResult.gemini && <p className={testResult.gemini.includes('✅') ? 'text-green-600' : 'text-red-600'}>{testResult.gemini}</p>}
            {testResult.firebase && <p className={testResult.firebase.includes('✅') ? 'text-green-600' : 'text-red-600'}>{testResult.firebase}</p>}
            {testResult.error && <p className="text-red-600">{testResult.error}</p>}
          </div>
        )}
        
        <button onClick={onClose} className="w-full text-slate-400 text-sm font-bold mt-2">
          <i className="fas fa-times mr-2"></i> Cancel
        </button>
      </div>
    </div>
  );
};

  const [snap, setSnap] = useState(data.getSnapshot());
  
  useEffect(() => {

    // Subscribe to real-time updates
    const unsubscribeEvents = data.subscribe('events', (events) => {
      setSnap(prev => ({ ...prev, events }));
    });

      unsubscribeEvents();

            <div>
              <div className="text-4xl font-bold mb-2">{snap.events[0].title}</div>
              <div className="text-2xl opacity-60">{snap.events[0].time || 'All day'}</div>
            </div>
          ) : (
            <div className="text-2xl opacity-30">No events today</div>
          )}

        <div className="kitchen-card p-8 rounded-[3rem] flex flex-col justify-center items-center">
          <i className="fas fa-microphone text-4xl mb-4 text-pink-500 animate-pulse"></i>
          <p className="text-xl opacity-80 text-center">"Hey Bot, add Bread to shopping"</p>

      <div className="w-full text-center opacity-30 text-sm">

      </div>

};

const ListComponent = ({ type, color, icon }) => {
  const [items, setItems] = useState([]);
  const [input, setInput] = useState('');
  const [isLoading, setIsLoading] = useState(false);
  
  useEffect(() => {
    // Initial load
    const initialItems = JSON.parse(localStorage.getItem(`pa_${type}`) || '[]');
    setItems(initialItems.filter(i => !i.completed));
    
    // Subscribe to real-time updates
    const unsubscribe = data.subscribe(type, setItems);
    
    return () => unsubscribe();
  }, [type]);
  
  const add = async () => {
    if (!input.trim()) return;
    
    setIsLoading(true);
    try {
      await data.add(type, { text: input, completed: false });
      setInput('');
    } catch (e) {
      console.error(`Error adding ${type}:`, e);
      alert(`Failed to add item. Please try again.`);
    } finally {
      setIsLoading(false);
    }
  };
  
  return (
    <div className="px-4 pb-32 space-y-4">
      <div className="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100">
        <div className="flex justify-between items-center mb-6">
          <h2 className="text-xl font-bold font-nunito">
            <i className={`fas ${icon} ${color} mr-2`}></i> 
            {type.charAt(0).toUpperCase() + type.slice(1)}
          </h2>
          <span className="bg-slate-50 px-3 py-1 rounded-full text-xs font-bold text-slate-400 border border-slate-100">
            {items.length} items
          </span>
        </div>
        
        <div className="space-y-3 max-h-[60vh] overflow-y-auto pr-2">
          {items.length === 0 && (
            <div className="text-center py-12 opacity-30 italic">
              {isLoading ? 'Loading...' : 'List is empty - add your first item!'}
            </div>
          )}
          
          {items.map(i => (
            <div 
              key={i.id} 
              className={`flex items-center p-4 rounded-2xl bg-slate-50 transition-all ${
                i.completed ? 'opacity-30 grayscale' : ''
              }`}
            >
              <button 
                onClick={() => data.toggle(type, i.id, i.completed)} 
                className={`w-6 h-6 rounded-lg border-2 mr-4 flex items-center justify-center ${
                  i.completed ? 'bg-green-500 border-green-500 text-white' : 'border-slate-200'
                }`}
              >
                {i.completed && <i className="fas fa-check text-xs"></i>}
              </button>
              <span className="flex-1 font-semibold text-slate-700">{i.text}</span>
              <button 
                onClick={() => data.remove(type, i.id)} 
                className="text-slate-300 hover:text-red-500 transition-colors"
                title="Delete item"
              >
                <i className="fas fa-trash-alt"></i>
              </button>
            </div>
          ))}
        </div>
        
        <div className="mt-6 flex gap-2">
          <input 
            value={input} 
            onChange={e => setInput(e.target.value)} 
            onKeyDown={e => e.key === 'Enter' && add()} 
            className="flex-1 bg-slate-50 border-2 border-slate-50 p-4 rounded-2xl text-sm focus:border-indigo-500 outline-none focus:ring-2 ring-indigo-200"
            placeholder={`Add to ${type}...`}
            disabled={isLoading}
          />
          <button 
            onClick={add} 
            disabled={isLoading || !input.trim()}
            className={`bg-indigo-600 text-white px-6 rounded-2xl shadow-lg ${
              isLoading || !input.trim() ? 'opacity-50 cursor-not-allowed' : 'hover:bg-indigo-700'
            }`}
          >
            {isLoading ? (
              <span className="loading-spinner"></span>
            ) : (
              <i className="fas fa-plus"></i>
            )}
          </button>
        </div>
      </div>
    </div>
  );
};

const App = () => {
  const [tab, setTab] = useState('home');
  const [botState, setBotState] = useState('idle');
  const [botMsg, setBotMsg] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [showKitchen, setShowKitchen] = useState(false);
  const [isProcessing, setIsProcessing] = useState(false);
  const recognition = useRef(null);
  const fileInput = useRef(null);
  
  // Cleanup on unmount
  useEffect(() => {
    return () => {
      data.cleanup();
      if (recognition.current) {
        recognition.current.stop();
        recognition.current = null;
      }
    };
  }, []);
  
  useEffect(() => {
    // Check for shared content from WhatsApp/other apps
    const checkShareTarget = () => {
      const params = new URLSearchParams(window.location.search);
      const sharedText = params.get('text') || params.get('title') || params.get('body');
      
      if (sharedText) {
        // Clear URL params but keep history
        const cleanUrl = window.location.pathname + window.location.hash;
        window.history.replaceState({}, document.title, cleanUrl);
        
        // Process the shared text
        setTimeout(() => {
          processVoice(sharedText);
        }, 500);
      }
    };
    
    // Initial check
    checkShareTarget();
    
    // Listen for popstate events (back/forward navigation)
    window.addEventListener('popstate', checkShareTarget);
    
    // Setup speech recognition
    setupSpeechRecognition();
    
    return () => {
      window.removeEventListener('popstate', checkShareTarget);
      if (recognition.current) {
        recognition.current.onstart = null;
        recognition.current.onend = null;
        recognition.current.onresult = null;
        recognition.current.onerror = null;
      }
    };
  }, []);
  
  const setupSpeechRecognition = () => {
    // Check if browser supports speech recognition
    const SpeechRecognition = window.SpeechRecognition || 
                           window.webkitSpeechRecognition || 
                           window.mozSpeechRecognition;
    
    if (SpeechRecognition) {
      recognition.current = new SpeechRecognition();
      recognition.current.continuous = false;
      recognition.current.interimResults = false;
      recognition.current.lang = 'en-US';
      
      recognition.current.onstart = () => {
        setBotState('listening');
        setBotMsg("Listening...");
      };
      
      recognition.current.onend = () => {
        if (botState !== 'thinking') {
          setBotState('idle');
          setBotMsg(null);
        }
      };
      
      recognition.current.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        processVoice(transcript);
      };
      
      recognition.current.onerror = (event) => {
        console.error("Speech recognition error:", event.error);
        setBotState('idle');
        setBotMsg(`Speech error: ${event.error}`);
      };
    } else {
      console.warn("Speech recognition not supported in this browser");
    }
  };
  
  const speak = (text) => {
    if (!('speechSynthesis' in window)) return;
    
    // Cancel any ongoing speech
    window.speechSynthesis.cancel();
    
    const utterance = new SpeechSynthesisUtterance(text.replace(/\*/g, ''));
    utterance.rate = 1.1;
    utterance.pitch = 1.05;
    
    // Get available voices and try to find a good English voice
    const voices = window.speechSynthesis.getVoices();
    const englishVoice = voices.find(v => 
      v.name.includes('Google US English') || 
      v.name.includes('English') || 
      v.lang.includes('en-US')
    );
    
    if (englishVoice) {
      utterance.voice = englishVoice;
    }
    
    window.speechSynthesis.speak(utterance);
  };
  
  const processVoice = async (text) => {
    if (isProcessing) return;
    if (!text.trim()) return;
    
    setIsProcessing(true);
    setBotState('thinking');
    setBotMsg("Brainstorming...");
    
    try {
      const prompt = `
Role: Cheerful Family PA for Nasima. Today: ${new Date().toDateString()}.
Input: "${text}".
Task: Analyze input. Return valid JSON:
{
  "transcription": "${text}",
  "actions": [
    { "type": "add_event", "title": "Event Name", "date": "${new Date().toISOString().split('T')[0]}", "time": "HH:MM" },
    { "type": "add_task", "text": "Task Text" },
    { "type": "add_shopping", "text": "Item" },
    { "type": "give_star", "who": "Name", "amount": 1 }
  ],
  "reply": "Conversational reply summarizing what was done"
}
Special: If user says "Brief me" or "What's happening today", set reply to "BRIEFING_REQUEST".
`;
      
      const res = await brain.think(prompt);
      
      if (res.error === "MISSING_KEY") {
        setBotMsg("🔑 Missing API Key! Tap Settings to add your Gemini key.");
        setBotState('idle');
        return;
      }
      
      if (res.reply === "BRIEFING_REQUEST") {
        const snap = data.getSnapshot();
        const briefingPrompt = `
Role: Family PA. Today: ${new Date().toDateString()}. 
Family members: ${snap.family.map(f => `${f.name} (${f.status})`).join(', ')}.
Tasks: ${snap.tasks.length} pending tasks.
Shopping: ${snap.shopping.length} items needed.
Events: ${snap.events.length} upcoming events.
Give a short, cheerful morning briefing in 2-3 sentences maximum.
`;
        
        const bRes = await brain.chat(briefingPrompt);
        setBotMsg(bRes);
        speak(bRes);
      } else {
        // Handle manual fallback if AI response is invalid
        if (!res.actions || !Array.isArray(res.actions)) {
          setBotMsg("I couldn't understand that command. Try being more specific!");
          setBotState('idle');
          setIsProcessing(false);
          return;
        }
        
        for (const a of res.actions) {
          if (a.type === 'add_event') {
            // Default to today if no date provided
            a.date = a.date || new Date().toISOString().split('T')[0];
            a.time = a.time || '18:00'; // Default to 6 PM
            await data.add('events', a);
          }
          if (a.type === 'add_task') await data.add('tasks', a);
          if (a.type === 'add_shopping') await data.add('shopping', a);
          if (a.type === 'give_star') {
            data.updateStars(a.who, a.amount || 1);
            // Show updated leaderboard
            setTimeout(() => setTab('stars'), 1000);
          }
        }
        
        let msg = `**Heard:** "${res.transcription}"\n\n${res.reply}`;
        setBotMsg(msg);
        
        // Only speak if it's not a briefing request
        if (res.reply !== "BRIEFING_REQUEST") {
          speak(res.reply);
        }
        
        // Auto-switch to relevant tab
        if (res.actions.length > 0) {
          const firstAction = res.actions[0];
          if (firstAction.type.includes('event')) setTab('plans');
          if (firstAction.type.includes('task')) setTab('tasks');
          if (firstAction.type.includes('shopping')) setTab('shopping');
          if (firstAction.type.includes('star')) setTab('stars');
        }
      }
      
    } catch (e) {
      console.error("Processing error:", e);
      setBotMsg("I had trouble processing that. Try again with simpler wording!");
    } finally {
      setBotState('idle');
      setIsProcessing(false);
    }
  };
  
  const handleFileUpload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    // Validate file
    const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'audio/mpeg', 'audio/wav', 'audio/webm'];
    const maxSize = 10 * 1024 * 1024; // 10MB
    
    if (!validTypes.includes(file.type)) {
      setBotMsg("I can only analyze images and audio files! Try a photo or voice note.");
      e.target.value = ''; // Clear input
      return;
    }
    
    if (file.size > maxSize) {
      setBotMsg("File too large! Please keep it under 10MB.");
      e.target.value = ''; // Clear input
      return;
    }
    
    setIsProcessing(true);
    setBotState('thinking');
    setBotMsg(`Analyzing ${file.type.includes('audio') ? 'voice note' : 'image'}...`);
    
    const reader = new FileReader();
    reader.onloadend = async () => {
      try {
        const base64 = reader.result.split(',')[1];
        const filePrompt = `
This is a ${file.type.includes('audio') ? 'voice note transcription' : 'image analysis'} request.
Extract all tasks, shopping items, events, or family updates mentioned.
Return JSON format:
{
  "transcription": "What was said or shown",
  "actions": [
    { "type": "add_task", "text": "Task from audio/image" },
    { "type": "add_shopping", "text": "Item from list" }
  ],
  "reply": "Summary of what I found"
}
`;
        
        const res = await brain.think(filePrompt, { type: file.type, base64 });
        processBrainResponse(res);
        
      } catch (e) {
        console.error("File processing error:", e);
        setBotMsg("I had trouble analyzing that file. Try a different format!");
        setBotState('idle');
        setIsProcessing(false);
      }
    };
    
    reader.readAsDataURL(file);
    e.target.value = ''; // Clear input after reading
  };
  
  const processBrainResponse = async (res) => {
    if (res.error === "MISSING_KEY") {
      setBotMsg("🔑 Missing API Key! Tap Settings to add your Gemini key.");
      setBotState('idle');
      setIsProcessing(false);
      return;
    }
    
    try {
      const actions = res.actions || [];
      for (const a of actions) {
        if (a.type === 'add_event') {
          a.date = a.date || new Date().toISOString().split('T')[0];
          a.time = a.time || '18:00';
          await data.add('events', a);
        }
        if (a.type === 'add_task') await data.add('tasks', a);
        if (a.type === 'add_shopping') await data.add('shopping', a);
        if (a.type === 'give_star') data.updateStars(a.who, a.amount || 1);
      }
      
      let msg = `**Analyzed:** ${res.reply}\n\n${actions.map(a => 
        `- ${a.type.split('_')[1]}: ${a.text || a.title || `${a.who} +${a.amount} stars`}`
      ).join('\n')}`;
      
      setBotMsg(msg);
      speak(res.reply);
      
      // Auto-switch tab based on content
      if (actions.some(a => a.type.includes('event'))) setTab('plans');
      if (actions.some(a => a.type.includes('task'))) setTab('tasks');
      if (actions.some(a => a.type.includes('shopping'))) setTab('shopping');
      
    } catch (e) {
      console.error("Response processing error:", e);
      setBotMsg("I found some items but had trouble organizing them. Check your lists!");
    } finally {
      setBotState('idle');
      setIsProcessing(false);
    }
  };
  
  return (
    <div className="max-w-md mx-auto min-h-screen pb-safe-nav flex flex-col relative">
      {showSettings && <SettingsModal onClose={() => setShowSettings(false)} />}
      {showKitchen && <KitchenMode onClose={() => setShowKitchen(false)} />}
      
      <header className="px-6 pt-10 pb-4 bg-white/80 backdrop-blur-md sticky top-0 z-50 flex justify-between items-center border-b border-slate-100">
        <div className="flex items-center gap-3">
          <div 
            onClick={() => setShowKitchen(true)} 
            className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg cursor-pointer active:scale-90 transition-transform hover:bg-indigo-700"
            title="Kitchen Mode"
          >
            <i className="fas fa-tv text-sm"></i>
          </div>
          <div>
            <h1 className="text-lg font-black text-slate-800 font-nunito tracking-tight">Nasima's PA</h1>
            <div className="text-[10px] font-black text-indigo-500 uppercase tracking-widest">Happy Family</div>
          </div>
        </div>
        <button 
          onClick={() => setShowSettings(true)} 
          className="w-10 h-10 bg-slate-100 rounded-full text-slate-400 flex items-center justify-center hover:bg-slate-200 transition-colors"
          title="Settings"
        >
          <i className="fas fa-cog"></i>
        </button>
      </header>
      
      <main className="flex-1 py-6 overflow-x-hidden">
        {tab === 'home' && (
          <div className="px-4 space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
            <div className="bg-white rounded-[2.5rem] p-8 shadow-xl shadow-indigo-100/50 border border-indigo-50 flex flex-col items-center text-center relative overflow-hidden">
              <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-indigo-500 to-pink-500"></div>
              
              <HappyBot 
                state={botState} 
                onClick={() => {
                  if (isProcessing) return;
                  if (recognition.current) {
                    if (botState === 'listening') {
                      recognition.current.stop();
                    } else {
                      recognition.current.start();
                    }
                  }
                }}
              />
              
              <h2 className="mt-6 text-xl font-bold text-slate-800 font-nunito">
                {botState === 'listening' ? (
                  <span className="flex items-center justify-center">
                    <span className="loading-spinner mr-2"></span>
                    Listening...
                  </span>
                ) : botState === 'thinking' ? (
                  <span className="flex items-center justify-center">
                    <span className="loading-spinner mr-2"></span>
                    Thinking...
                  </span>
                ) : (
                  "Ready for your update?"
                )}
              </h2>
              
              {botMsg ? (
                <div className="mt-4 bg-indigo-50 p-5 rounded-[1.5rem] text-sm text-indigo-900 ai-response text-left w-full border border-indigo-100 max-h-[40vh] overflow-y-auto">
                  <div dangerouslySetInnerHTML={{__html: marked.parse(botMsg)}} />
                </div>
              ) : (
                <div className="mt-6 flex flex-col sm:flex-row gap-3 w-full">
                  <button 
                    onClick={() => !isProcessing && processVoice("Brief me")} 
                    className="flex-1 bg-indigo-600 text-white py-3 rounded-2xl font-bold shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                    disabled={isProcessing}
                  >
                    {isProcessing ? (
                      <span className="flex items-center justify-center">
                        <span className="loading-spinner mr-2"></span>
                        Processing...
                      </span>
                    ) : (
                      <i className="fas fa-sun mr-2"></i> Daily Brief
                    )}
                  </button>
                  <button 
                    onClick={() => fileInput.current.click()} 
                    className="flex-1 bg-slate-100 text-slate-600 py-3 rounded-2xl font-bold hover:bg-slate-200 transition-colors"
                    disabled={isProcessing}
                  >
                    <i className="fas fa-paperclip mr-2"></i> Upload File
                  </button>
                  <input 
                    type="file" 
                    ref={fileInput} 
                    onChange={handleFileUpload} 
                    className="hidden" 
                    accept="image/*,audio/*"
                    disabled={isProcessing}
                  />
                </div>
              )}
            </div>
            
            <section>
              <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 px-2">Family Pulse</h3>
              <div className="grid grid-cols-3 gap-3">
                {data.getFamilyStatus().map(f => (

                    className={`${f.style} rounded-[1.5rem] p-3 text-center shadow-sm relative overflow-hidden hover:scale-[1.02] transition-transform cursor-pointer`}

                    title={`Tap to give ${f.name} a star!`}
                  >
                    <div className="absolute top-1 right-2 text-[10px] font-black opacity-40">⭐ {f.stars}</div>
                    <div className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center mx-auto mb-1 text-xs font-bold">{f.letter}</div>
                    <p className="font-bold text-[10px] truncate">{f.name}</p>
                    <p className="text-[8px] opacity-70 truncate">{f.status}</p>
                  </div>
                ))}
              </div>
            </section>
          </div>
        )}
        
        {tab === 'tasks' && <ListComponent type="tasks" color="text-indigo-500" icon="fa-check-double"/>}
        {tab === 'shopping' && <ListComponent type="shopping" color="text-green-500" icon="fa-shopping-basket"/>}
        
        {tab === 'plans' && (
          <div className="px-4 pb-32">
            <div className="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100 min-h-[60vh]">
              <h2 className="text-xl font-bold font-nunito mb-6"><i className="fas fa-calendar-alt text-pink-500 mr-2"></i> Schedule</h2>
              <div className="space-y-4">
                {data.getSnapshot().events.length === 0 && (
                  <div className="text-center py-12 opacity-30 italic">
                    No events planned - tap the + button to add one!
                  </div>

                {data.getSnapshot().events.map(e => (

                    <button

                      <div className="absolute bottom-0 left-0 right-0 h-1 bg-white/20">

                <p className="font-bold mb-2">🏆 How it works:</p>
                <p>"Hey Bot, give 5 stars to Zaara for cleaning"</p>
                <p className="mt-2 opacity-70 text-xs">Stars reset monthly. First place gets special privileges!</p>
              </div>
            </div>
          </div>
        )}
      </main>
      
      <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 h-[80px] pb-safe px-6 flex justify-between items-center z-40">
        <button 
          onClick={() => setTab('home')} 
          className={`flex flex-col items-center gap-1 transition-all ${
            tab === 'home' ? 'text-indigo-600 scale-105' : 'text-slate-300'
          }`}
        >
          <i className="fas fa-home text-xl"></i>
          <span className="text-[10px] font-black uppercase">Home</span>
        </button>
        
        <button 
          onClick={() => setTab('tasks')} 
          className={`flex flex-col items-center gap-1 transition-all ${
            tab === 'tasks' ? 'text-indigo-600 scale-105' : 'text-slate-300'
          }`}
        >
          <i className="fas fa-check-circle text-xl"></i>
          <span className="text-[10px] font-black uppercase">Tasks</span>
        </button>
        
        <div className="w-16"></div>
        
        <button 
          onClick={() => setTab('plans')} 
          className={`flex flex-col items-center gap-1 transition-all ${
            tab === 'plans' ? 'text-indigo-600 scale-105' : 'text-slate-300'
          }`}
        >
          <i className="fas fa-calendar-alt text-xl"></i>
          <span className="text-[10px] font-black uppercase">Plan</span>
        </button>
        
        <button 
          onClick={() => setTab('stars')} 
          className={`flex flex-col items-center gap-1 transition-all ${
            tab === 'stars' ? 'text-indigo-600 scale-105' : 'text-slate-300'
          }`}
        >
          <i className="fas fa-star text-xl"></i>
          <span className="text-[10px] font-black uppercase">Stars</span>
        </button>
        
        <button 
          onClick={() => {
            if (isProcessing) return;
            if (recognition.current) {
              if (botState === 'listening') {
                recognition.current.stop();
              } else {
                recognition.current.start();
              }
            }
          }} 
          className={`absolute -top-8 left-1/2 -translate-x-1/2 w-16 h-16 rounded-full border-4 border-white shadow-xl flex items-center justify-center text-white text-xl active:scale-90 transition-transform ${
            botState === 'listening' ? 'bg-red-500 animate-pulse' : 
            isProcessing ? 'bg-yellow-500' : 
            'bg-gradient-to-br from-indigo-500 to-purple-600'
          }`}
          disabled={isProcessing}
          title={botState === 'listening' ? 'Stop listening' : 'Start listening'}
        >
          <i className={`fas ${botState === 'listening' ? 'fa-stop' : 'fa-microphone'}`}></i>
        </button>
      </nav>
      
      {/* Offline indicator */}
      {!navigator.onLine && (
        <div className="fixed top-4 right-4 bg-yellow-500 text-white px-4 py-2 rounded-full shadow-lg z-50 flex items-center gap-2">
          <i className="fas fa-wifi-slash"></i>
          <span>Offline Mode</span>
        </div>
      )}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
